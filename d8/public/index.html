<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="content">
    <meta name="author" content="yourname">
    <title>Web title</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body>
    <header>
        <nav class="flex fixed flex-row justify-between w-full h-[10vh] py-4 px-8 bg-white">
            <div class="flex justify-center items-center gap-2 ">
                <i data-lucide="hexagon"></i>
                <span><h2 class="text-xl">HEXAGON</h2></span>
            </div>
        </nav>
    </header>
    <main  class="flex flex-row justify-center items-center w-screen min-h-screen bg-gray-300">
        <div class="flex flex-col justify-center min-h-96 min-w-64 items-center bg-white p-10 rounded-xl gap-5">
            <h2 class="text-3xl">Test Form</h2>
            <form id="originalForm" class="flex flex-col gap-5">
                <input
                    class="flex bg-gray-200 p-2 rounded-lg"
                    id="title"
                    name="title"
                    type="text"
                    placeholder="Enter title"
                >
                <input
                    class="flex bg-gray-200 p-2 rounded-lg"
                    id="personName"
                    name="personName"
                    type="text"
                    placeholder="Enter name"
                >
                <input
                    class="flex bg-gray-200 p-2 rounded-lg"
                    id="value"
                    name="value"
                    type="number"
                    placeholder="Enter Value"
                >

                <button
                    class="flex bg-gray-200 p-2 rounded-lg"
                    type="submit"
                >Submit</button>
            </form>
        </div>
        <div class="flex flex-col justify-center min-h-96 min-w-64 items-center bg-white p-10 rounded-xl gap-5">
            <h2 class="text-xl" id="messageOutput">Message goes here</h2>
            <p id="titleOutput">Title Output</p>
            <p id="nameOutput">Name Output</p>
            <p id="valueOutput">Value Output</p>
        </div>
    </main>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="script.js"></script>
</body>
</html>
